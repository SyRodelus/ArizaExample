<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Catálogo | ARIZA Joyas de Autor</title>
  <meta name="description" content="Catálogo de joyas ARIZA en oro 18K: anillos, cadenas, pulsos, topos, candongas, dijes y herrajes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="cabecera"></div>
  <main id="principal" class="contenedor">
    <nav class="migas" aria-label="Migas de pan" id="migas"></nav>
    <h1 class="tienda__titulo" id="titulo">Catálogo</h1>
    <div class="chips" id="chips"></div>
    <div class="barra-tienda">
      <button class="barra-tienda__filtro" type="button" data-panel="panel-filtros" id="boton-filtros"></button>
      <p class="barra-tienda__total" id="total" role="status"></p>
      <label class="barra-tienda__orden"><span>Ordenar por</span>
        <select id="orden" aria-label="Ordenar productos">
          <option value="destacados">Destacados</option>
          <option value="menor">Menor precio</option>
          <option value="mayor">Mayor precio</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
      </label>
    </div>
    <div class="etiquetas" id="etiquetas"></div>
    <div class="tienda__grid">
      <div class="grid-productos" id="grid"></div>
      <div id="vacio"></div>
      <div class="tienda__mas" id="mas"></div>
    </div>
  </main>
  <aside class="panel panel--izq panel--ancho" id="panel-filtros" aria-label="Filtros" aria-hidden="true">
    <div class="panel__cabeza"><h2 class="panel__titulo">Filtrar</h2><button class="icono-btn" type="button" data-cerrar-panel aria-label="Cerrar filtros" id="cerrar-filtros"></button></div>
    <div class="panel__cuerpo" id="filtros"></div>
    <div class="panel__pie panel__botones">
      <button class="btn" type="button" id="limpiar">Limpiar</button>
      <button class="btn btn--lleno" type="button" data-cerrar-panel id="ver-resultados">Ver resultados</button>
    </div>
  </aside>
  <div id="pie"></div>

  <script src="js/config.js"></script>
  <script src="data/catalogo.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tienda.js"></script>
</body>
</html>
